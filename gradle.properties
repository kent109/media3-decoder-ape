org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Gradle 9.7.1 要求运行它的 JVM 在 17~26 之间；本机默认挑了 JDK 8 导致
# "Incompatible Gradle JVM version"。此处强制 Gradle 使用已安装的 JDK 25。
# （注意：这是“运行 Gradle 的 JVM”，与下方“编译目标字节码 Java 8”无关。）
org.gradle.java.home=D:/Program Files/Java/jdk-25.0.2
android.useAndroidX=true
# Java 8 bytecode is a deliberate floor: the AAR stays consumable by the oldest
# toolchains Media3 itself supports. This silences javac 21's "source value 8 is
# obsolete" note; revisit when Media3 raises its own baseline.
android.javaCompile.suppressSourceTargetDeprecationWarning=true
